<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<title>NO</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3efe8;--fg:#14141a;--mut:#6b6b76;--card:#fff;--line:#d9d4ca;--acc:#c8421e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e12;--fg:#f1eee8;--mut:#9a9aa6;--card:#181820;--line:#2a2a35;--acc:#ff6a3d}}
:root[data-theme="dark"]{--bg:#0e0e12;--fg:#f1eee8;--mut:#9a9aa6;--card:#181820;--line:#2a2a35;--acc:#ff6a3d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) center/cover fixed;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow-x:hidden}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-weight:900;letter-spacing:.3em;font-size:20px}
.btn{border:1px solid var(--fg);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.sm{padding:6px 12px;font-size:12px}
.hero{min-height:88vh;display:grid;align-content:center;justify-items:center;text-align:center;padding:30px 16px;perspective:1000px;overflow:hidden}
.hero h1{font-size:42px;line-height:1.1;margin:0 0 10px;font-weight:900}
@media (min-width:700px){.hero h1{font-size:72px}}
.hero p{color:var(--mut);margin:0 0 26px}
.stage{height:270px;width:100%;perspective:900px;display:grid;place-items:center;margin-top:20px}
.tilt{transform-style:preserve-3d;transition:transform .15s}
.ring{position:relative;width:130px;height:180px;transform-style:preserve-3d;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotateY(-360deg)}}
.face{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 20px 40px #0003;overflow:hidden}
.face svg{width:80%}
.face img,.art img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain}
.face img{padding:10px}
section{padding:50px 20px;max-width:1100px;margin:auto}
h2{font-size:28px;margin:0 0 24px}
.tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 16px;border-radius:999px;cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--fg);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;perspective:1000px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;transition:transform .15s,box-shadow .2s;opacity:0;transform:rotateX(35deg) translateY(40px);animation:in .7s forwards}
@keyframes in{to{opacity:1;transform:none}}
.card:hover{box-shadow:0 24px 40px #0003}
.art{height:200px;position:relative;overflow:hidden;display:grid;place-items:center}
.art svg{height:100%;filter:drop-shadow(0 14px 10px #0004)}
.card h3{margin:12px 0 2px;font-size:16px}
.code{color:var(--mut);font-size:12px;display:block;margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:center}
.price{color:var(--acc);font-weight:800}
.add{border:0;background:var(--fg);color:var(--bg);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
.drawer{position:fixed;top:0;bottom:0;left:0;width:92vw;max-width:340px;background:var(--card);border-right:1px solid var(--line);z-index:40;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-105%);transition:transform .3s;overflow:auto}
.drawer.open{transform:none}
.drawer.right{left:auto;right:0;border-right:0;border-left:1px solid var(--line);transform:translateX(105%);width:100vw;max-width:420px}
.drawer.right.open{transform:none}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
input,select{width:100%;padding:9px;margin:4px 0 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font-family:inherit}
input[type=color]{height:40px;padding:2px}
.badge{background:var(--acc);color:#fff;border-radius:999px;padding:1px 7px;font-size:12px;margin-right:4px}
footer{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;text-align:center;color:var(--mut);padding:40px 20px;font-size:13px}
.x{float:left;background:none;border:0;color:var(--fg);font-size:22px;cursor:pointer}
.del{background:none;border:0;color:var(--acc);cursor:pointer;font-family:inherit}
#admBtn{display:none}
.adm h3{margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line);font-size:16px}
.pr{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.pr .pt{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.pr .pt img,.pr .pt i{width:44px;height:44px;border-radius:8px;object-fit:cover;display:block}
.msg{color:var(--mut);font-size:13px;margin:6px 0}
label{font-size:13px;color:var(--mut);display:block}
#login{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.65);z-index:90;display:none;align-items:center;justify-content:center}
#login.open{display:flex}
#login>div{background:var(--card);padding:20px;border-radius:16px;width:90%;max-width:320px}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo">NOIR</div>
  <div style="display:flex;gap:8px">
    <button class="btn ghost" id="admBtn">⚙️ الأدمن</button>
    <button class="btn" id="cartBtn">السلة<span class="badge" id="cnt">0</span></button>
  </div>
</header>

<div class="hero" id="hero">
  <h1 id="h1"></h1>
  <p id="sub"></p>
  <button class="btn" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">تسوّق دلوقتي</button>
  <div class="stage"><div class="tilt" id="tilt"><div class="ring" id="ring"></div></div></div>
</div>

<section id="shop">
  <h2>المنتجات</h2>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</section>
<footer id="foot"></footer>

<div class="drawer" id="cart">
  <button class="x" id="cartX">×</button><h2>السلة</h2>
  <div id="cartItems"></div>
  <input id="cc" placeholder="كود الخصم"><button class="btn ghost sm" id="ca">تطبيق الكود</button>
  <div class="msg" id="cmsg"></div>
  <h3 id="total"></h3>
  <button class="btn" id="order" style="width:100%">إتمام الطلب (واتساب)</button>
</div>

<div class="drawer right adm" id="adm">
  <button class="x" id="admX">×</button><h2>لوحة الأدمن</h2>
  <div class="msg" id="admMsg"></div>
  <button class="btn" id="dl" style="width:100%;background:var(--acc);border-color:var(--acc)">⬇️ تحميل index.html (احفظ التغييرات)</button>

  <h3>الروابط</h3>
  <label>لينك عادي (للزوار)<input id="lnkN" readonly=""></label><button class="btn ghost sm" data-copy="lnkN">نسخ</button>
  <label style="margin-top:8px">لينك الأدمن (ليك إنت بس)<input id="lnkA" readonly=""></label><button class="btn ghost sm" data-copy="lnkA">نسخ</button>

  <h3>إعدادات الموقع</h3>
  <label>اسم المتجر<input id="sName"></label>
  <label>العنوان الرئيسي<input id="sTitle"></label>
  <label>الوصف تحت العنوان<input id="sSub"></label>
  <label>رقم الواتساب (بكود الدولة، مثال 201001234567)<input id="sWa" inputmode="numeric"></label>
  <label>لون التمييز<input id="sAcc" type="color"></label>
  <label>لون الخلفية<input id="sBg" type="color"></label>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn ghost sm" id="bgImgPick">🖼️ صورة خلفية من جهازك</button>
    <button class="btn ghost sm" id="bgReset">إزالة الخلفية المخصصة</button>
  </div>
  <label style="margin-top:10px">مدة لفّة الحلقة بالثواني (أقل = أسرع): <b id="spdV"></b><input id="sSpd" type="range" min="2" max="30" step="1"></label>
  <label>الوضع<select id="sTheme"><option value="auto">تلقائي</option><option value="light">فاتح</option><option value="dark">غامق</option></select></label>

  <h3>إضافة منتج</h3>
  <label>اسم المنتج<input id="fn"></label>
  <label>السعر (ج.م)<input id="fp" type="number" inputmode="decimal"></label>
  <label>كود المنتج<input id="fk" placeholder="مثال: HD-01"></label>
  <label>المقاسات (بفاصلة)<input id="fs" value="S,M,L,XL"></label>
  <label>النوع<select id="ft"><option value="hoodie">هودي</option><option value="shirt">تيشيرت</option><option value="pants">بنطلون</option></select></label>
  <label>اللون (لو مفيش صورة)<input id="fc" type="color" value="#2b2b33"></label>
  <button class="btn ghost sm" id="fimg">📷 صورة المنتج من جهازك</button> <span class="msg" id="fimgM"></span>
  <button class="btn" id="save" style="width:100%;margin-top:8px">إضافة منتج</button>

  <h3>منتجاتك (عدّل مباشرة)</h3><div id="admList"></div>

  <h3>أكواد الخصم</h3>
  <div style="display:flex;gap:6px"><input id="cd" placeholder="الكود"><input id="cp" type="number" placeholder="%" style="max-width:80px"></div>
  <button class="btn ghost sm" id="cadd">إضافة كود</button>
  <div id="codeList"></div>

  <h3>كلمة السر</h3>
  <input id="np" type="password" placeholder="كلمة سر جديدة"><button class="btn ghost sm" id="chg">تغيير</button>
</div>

<div id="login"><div><h3 style="margin:0 0 10px">دخول الأدمن</h3><input id="lp" type="password" placeholder="كلمة السر"><div class="msg" id="lm"></div><button class="btn" id="lgo" style="width:100%">دخول</button><button class="btn ghost sm" id="lx" style="margin-top:8px">إلغاء</button></div></div>

<script>
const ORIGINAL="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
const $=id=>document.getElementById(id);
const DATA=JSON.parse($("data").textContent);
const TYPES={hoodie:"هوديز",shirt:"تيشيرتات",pants:"بناطيل"};
let S=DATA.settings,products=DATA.products,codes=DATA.codes,hash=DATA.hash,cat="all",cart=[],disc=null,newImg="";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const splitSizes=v=>String(v).split(/[,،]/).map(x=>x.trim()).filter(Boolean);

function applySettings(){
 const r=document.documentElement;
 document.title=S.name;$("logo").textContent=S.name;$("foot").textContent="© "+S.name;
 $("h1").textContent=S.title;$("sub").textContent=S.sub;
 S.accent?r.style.setProperty("--acc",S.accent):r.style.removeProperty("--acc");
 S.bg?r.style.setProperty("--bg",S.bg):r.style.removeProperty("--bg");
 document.body.style.backgroundImage=S.bgImg?'url("'+S.bgImg+'")':"";
 S.theme==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",S.theme);
 $("ring").style.animationDuration=S.speed+"s";
}
function svg(t,c){
 const b={shirt:'<path d="M30 15 L10 30 L20 42 L28 36 L28 88 L72 88 L72 36 L80 42 L90 30 L70 15 Q50 28 30 15Z"/>',
 hoodie:'<path d="M32 18 L8 54 L20 60 L30 44 L30 88 L70 88 L70 44 L80 60 L92 54 L68 18 Q50 30 32 18Z"/><path d="M36 17 Q50 0 64 17 Q50 32 36 17Z" fill="#0004"/><rect x="38" y="64" width="24" height="14" rx="3" fill="#0003"/>',
 pants:'<path d="M30 8 L70 8 L74 92 L54 92 L50 38 L46 92 L26 92Z"/>'}[t]||"";
 return '<svg viewBox="0 0 100 100" fill="'+esc(c)+'">'+b+'</svg>'}
const art=p=>p.img?'<img src="'+p.img+'" alt="">':svg(p.type,p.color);
function renderRing(){
 const l=products.slice(0,6),r=innerWidth<500?170:260;
 $("ring").innerHTML=l.map((p,i)=>'<div class="face" style="transform:rotateY('+(i*360/l.length)+'deg) translateZ('+r+'px)">'+art(p)+'</div>').join("")}
function renderTabs(){
 $("tabs").innerHTML=[["all","الكل"],...Object.entries(TYPES)].map(([k,v])=>'<button class="'+(cat===k?"on":"")+'" data-k="'+k+'">'+v+'</button>').join("")}
function renderGrid(){
 const l=products.filter(p=>cat==="all"||p.type===cat);
 $("grid").innerHTML=l.map((p,i)=>{
  const sz=(p.sizes&&p.sizes.length)?'<select>'+p.sizes.map(s=>'<option>'+esc(s)+'</option>').join("")+'</select>':"";
  return '<div class="card" style="animation-delay:'+(i*70)+'ms"><div class="art">'+art(p)+'</div><h3>'+esc(p.name)+'</h3><span class="code">'+(p.code?"كود: "+esc(p.code):"")+'</span>'+sz+'<div class="row"><span class="price">'+Number(p.price)+' ج.م</span><button class="add" data-id="'+esc(p.id)+'">+</button></div></div>'}).join("")||"<p>لا توجد منتجات.</p>"}
function totals(){const sub=cart.reduce((s,p)=>s+Number(p.price),0);const d=disc?Math.round(sub*disc.pct/100):0;return{sub,d,total:sub-d}}
function renderCart(){
 $("cnt").textContent=cart.length;
 $("cartItems").innerHTML=cart.map((p,i)=>'<div class="item"><span>'+esc(p.name)+(p.size?" — "+esc(p.size):"")+'</span><span>'+Number(p.price)+' <button class="del" data-i="'+i+'">حذف</button></span></div>').join("")||"<p class='msg'>السلة فاضية</p>";
 const t=totals();$("total").textContent=(t.d?"خصم "+disc.pct+"% (−"+t.d+") — ":"")+"الإجمالي: "+t.total+" ج.م"}
function renderCodes(){
 $("codeList").innerHTML=codes.map((c,i)=>'<div class="item"><span>'+esc(c.code)+' — '+Number(c.pct)+'%</span><button class="del" data-ci="'+i+'">حذف</button></div>').join("")||"<p class='msg'>مفيش أكواد.</p>"}
function renderAdm(){
 $("admList").innerHTML=products.map(p=>'<div class="pr" data-id="'+esc(p.id)+'"><div class="pt">'+(p.img?'<img src="'+p.img+'">':'<i style="background:'+esc(p.color)+'"></i>')+'<button class="btn ghost sm" data-act="img">صورة</button>'+(p.img?'<button class="btn ghost sm" data-act="noimg">إزالة الصورة</button>':"")+'<button class="del" data-act="del" style="margin-right:auto">حذف المنتج</button></div><input data-f="name" value="'+esc(p.name)+'"><input data-f="price" type="number" value="'+Number(p.price)+'"><input data-f="code" placeholder="الكود" value="'+esc(p.code)+'"><input data-f="sizes" placeholder="المقاسات" value="'+esc((p.sizes||[]).join(","))+'"></div>').join("")||"<p class='msg'>مفيش منتجات.</p>"}
function fillSettings(){
 const base=location.href.split("#")[0].split("?")[0];$("lnkN").value=base;$("lnkA").value=base+"#admin";
 $("sName").value=S.name;$("sTitle").value=S.title;$("sSub").value=S.sub;$("sWa").value=S.whatsapp;
 $("sAcc").value=S.accent||"#c8421e";$("sBg").value=S.bg||"#f3efe8";$("sSpd").value=S.speed;$("spdV").textContent=S.speed;$("sTheme").value=S.theme}
function renderAll(){renderRing();renderTabs();renderGrid();renderAdm();renderCodes()}

function pick(max,q,cb){
 const i=document.createElement("input");i.type="file";i.accept="image/*";
 i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const keep=/png|webp|gif/.test(f.type),im=new Image();im.onload=()=>{
   const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
   c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
   const x=c.getContext("2d");if(!keep){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);
   cb(keep?c.toDataURL("image/webp",q):c.toDataURL("image/jpeg",q))};im.src=r.result};r.readAsDataURL(f)};
 i.click()}

/* store */
$("tabs").onclick=e=>{const k=e.target.dataset.k;if(k){cat=k;renderTabs();renderGrid()}};
$("grid").onclick=e=>{
 const id=e.target.dataset.id;if(!id)return;
 const p=products.find(x=>x.id===id),sel=e.target.closest(".card").querySelector("select");
 cart.push({name:p.name,price:p.price,size:sel?sel.value:"",code:p.code});renderCart();$("cart").classList.add("open")};
$("grid").addEventListener("pointermove",e=>{const c=e.target.closest(".card");if(!c||e.target.tagName==="SELECT")return;const r=c.getBoundingClientRect();
 const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.animation="none";c.style.opacity=1;c.style.transform="rotateY("+x*18+"deg) rotateX("+(-y*18)+"deg)"});
$("grid").addEventListener("pointerout",e=>{const c=e.target.closest(".card");if(c)c.style.transform="none"});

$("cartItems").onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){cart.splice(i,1);renderCart()}};
$("ca").onclick=()=>{const v=$("cc").value.trim().toLowerCase();const c=codes.find(x=>x.code.toLowerCase()===v);
 disc=c||null;$("cmsg").textContent=c?"تم تطبيق خصم "+c.pct+"%":"الكود غير صحيح";renderCart()};
$("order").onclick=()=>{
 if(!cart.length){$("cmsg").textContent="السلة فاضية";return}
 const wa=String(S.whatsapp||"").replace(/\D/g,"");
 if(!wa){$("cmsg").textContent="رقم الواتساب لسه مش متضاف";return}
 const t=totals();
 const msg="طلب جديد من "+S.name+":\n"+cart.map(p=>"• "+p.name+(p.code?" ("+p.code+")":"")+(p.size?" — مقاس "+p.size:"")+" — "+p.price+" ج.م").join("\n")+(disc?"\nكود خصم: "+disc.code+" (−"+t.d+")":"")+"\nالإجمالي: "+t.total+" ج.م";
 window.open("https://wa.me/"+wa+"?text="+encodeURIComponent(msg),"_blank")};

/* admin */
$("admBtn").onclick=()=>$("adm").classList.add("open");$("admX").onclick=()=>$("adm").classList.remove("open");
const note=t=>{$("admMsg").textContent=t};
const SAVE="غيّرت حاجة؟ اضغط «تحميل index.html» وارفع الملف الجديد.";
[["sName","name"],["sTitle","title"],["sSub","sub"],["sWa","whatsapp"]].forEach(([id,k])=>$(id).oninput=()=>{S[k]=$(id).value;applySettings();note(SAVE)});
$("sAcc").oninput=()=>{S.accent=$("sAcc").value;applySettings();note(SAVE)};
$("sBg").oninput=()=>{S.bg=$("sBg").value;applySettings();note(SAVE)};
$("sSpd").oninput=()=>{S.speed=Number($("sSpd").value);$("spdV").textContent=S.speed;applySettings();note(SAVE)};
$("sTheme").onchange=()=>{S.theme=$("sTheme").value;applySettings();note(SAVE)};
$("bgImgPick").onclick=()=>pick(1600,.7,d=>{S.bgImg=d;applySettings();note(SAVE)});
$("bgReset").onclick=()=>{S.bgImg="";S.bg="";applySettings();note(SAVE)};
$("fimg").onclick=()=>pick(800,.8,d=>{newImg=d;$("fimgM").textContent="تم اختيار الصورة ✓"});
$("save").onclick=()=>{
 const name=$("fn").value.trim(),price=Number($("fp").value);if(!name||!price){note("اكتب الاسم والسعر");return}
 products.push({id:"p"+Date.now(),name,price,type:$("ft").value,color:$("fc").value,img:newImg,code:$("fk").value.trim(),sizes:splitSizes($("fs").value)});
 newImg="";$("fimgM").textContent="";$("fn").value="";$("fp").value="";$("fk").value="";renderAll();note("تمت الإضافة. "+SAVE)};
$("admList").onchange=e=>{
 const f=e.target.dataset.f;if(!f)return;const p=products.find(x=>x.id===e.target.closest(".pr").dataset.id);if(!p)return;
 p[f]=f==="price"?Number(e.target.value):f==="sizes"?splitSizes(e.target.value):e.target.value;
 renderRing();renderGrid();note(SAVE)};
$("admList").onclick=e=>{
 const a=e.target.dataset.act;if(!a)return;const id=e.target.closest(".pr").dataset.id,p=products.find(x=>x.id===id);
 if(a==="del"){products=products.filter(x=>x.id!==id);renderAll();note(SAVE)}
 if(a==="noimg"){p.img="";renderAll();note(SAVE)}
 if(a==="img")pick(800,.8,d=>{p.img=d;renderAll();note(SAVE)})};
$("cadd").onclick=()=>{const c=$("cd").value.trim(),p=Number($("cp").value);if(!c||!(p>0&&p<=100)){note("اكتب كود ونسبة من 1 إلى 100");return}
 codes.push({code:c,pct:p});$("cd").value="";$("cp").value="";renderCodes();note(SAVE)};
$("codeList").onclick=e=>{const i=e.target.dataset.ci;if(i!==undefined){codes.splice(i,1);renderCodes();note(SAVE)}};
function sha(s){
 const m=unescape(encodeURIComponent(s)),K=[],H=[];let n=2;
 const isP=x=>{for(let d=2;d*d<=x;d++)if(x%d===0)return false;return true};
 while(K.length<64){if(isP(n)){if(H.length<8)H.push((Math.pow(n,.5)%1)*4294967296|0);K.push((Math.pow(n,1/3)%1)*4294967296|0)}n++}
 const l=m.length,w=[];
 for(let i=0;i<l;i++)w[i>>2]|=m.charCodeAt(i)<<(24-(i%4)*8);
 w[l>>2]|=0x80<<(24-(l%4)*8);w[(((l+8)>>6)+1)*16-1]=l*8;
 let h=H.slice();
 for(let o=0;o<w.length;o+=16){
  const x=[];
  for(let t=0;t<64;t++){
   if(t<16)x[t]=w[o+t]|0;
   else{const a=x[t-15],c=x[t-2];
    x[t]=(x[t-16]+((a>>>7|a<<25)^(a>>>18|a<<14)^(a>>>3))+x[t-7]+((c>>>17|c<<15)^(c>>>19|c<<13)^(c>>>10)))|0}}
  let a=h[0],b=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],q=h[7];
  for(let t=0;t<64;t++){
   const t1=(q+((e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7))+((e&f)^(~e&g))+K[t]+x[t])|0;
   const t2=(((a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10))+((a&b)^(a&c)^(b&c)))|0;
   q=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
  h=[h[0]+a|0,h[1]+b|0,h[2]+c|0,h[3]+d|0,h[4]+e|0,h[5]+f|0,h[6]+g|0,h[7]+q|0]}
 return h.map(v=>("00000000"+(v>>>0).toString(16)).slice(-8)).join("")}
$("chg").onclick=async()=>{const v=$("np").value;if(v.length<6){note("كلمة السر لازم 6 حروف على الأقل");return}hash=await sha(v);$("np").value="";note("اتغيرت. "+SAVE)};
$("dl").onclick=()=>{
 const json=JSON.stringify({hash,settings:S,codes,products}).replace(/</g,"\\u003c");
 let out=ORIGINAL.replace(/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
 out=out.replace(/<title>[\s\S]*?<\/title>/,()=>"<title>"+esc(S.name)+"</title>");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"text/html"}));a.download="index.html";a.click()};
function showLogin(){$("lm").textContent="";$("lp").value="";$("login").classList.add("open");setTimeout(()=>$("lp").focus(),50)}
$("adm").addEventListener("click",e=>{const k=e.target.dataset.copy;if(!k)return;const i=$(k);i.select();try{(navigator.clipboard?navigator.clipboard.writeText(i.value):Promise.reject()).catch(()=>document.execCommand("copy"))}catch(_){document.execCommand("copy")}note("اتنسخ ✓")});
$("lx").onclick=()=>$("login").classList.remove("open");
$("lgo").onclick=()=>{
 if(sha($("lp").value)===hash){$("login").classList.remove("open");$("admBtn").style.display="inline-block";fillSettings();$("adm").classList.add("open")}
 else $("lm").textContent="كلمة السر غلط"};
$("lp").onkeydown=e=>{if(e.key==="Enter")$("lgo").click()};
let taps=0,tapT;
$("foot").onclick=()=>{taps++;clearTimeout(tapT);tapT=setTimeout(()=>{taps=0},1500);if(taps>=5){taps=0;showLogin()}};
function openAdminIfHash(){if(location.hash==="#admin"||/[?&]admin(&|$)/.test(location.search))showLogin()}
addEventListener("hashchange",()=>location.reload());
addEventListener("resize",renderRing);
applySettings();renderAll();renderCart();openAdminIfHash();
